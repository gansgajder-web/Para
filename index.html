<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЖЖ — Живий журнал</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- TON Connect UI SDK -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .header {
            background-color: #1f1f1f;
            color: #ffffff;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }
        .header h1 {
            margin: 0;
            font-size: 18px;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #ton-connect-btn {
            transform: scale(0.85);
            transform-origin: right center;
        }
        #chat-container {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            background: #1e1e1e;
            padding: 12px 14px;
            border-radius: 10px;
            max-width: 90%;
            border: 1px solid #2a2a2a;
            display: flex;
            gap: 10px;
            transition: border-color 0.3s;
        }
        .message.private-msg {
            border-color: #ffd54f;
            background: #25231c;
        }
        .message.highlight {
            border-color: #64b5f6;
            background: #252830;
        }
        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            flex-shrink: 0;
            background-size: cover;
            background-position: center;
            text-transform: uppercase;
        }
        .msg-content {
            flex: 1;
        }
        .msg-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .username {
            font-size: 13px;
            font-weight: bold;
            color: #64b5f6;
        }
        .msg-time {
            font-size: 10px;
            color: #888;
        }
        .reply-quote {
            background: rgba(100, 181, 246, 0.1);
            border-left: 3px solid #64b5f6;
            padding: 6px 8px;
            margin-bottom: 6px;
            border-radius: 4px;
            font-size: 12px;
            color: #b0bec5;
        }
        .reply-quote-author {
            font-weight: bold;
            color: #64b5f6;
            margin-bottom: 2px;
        }
        .message-text {
            word-break: break-word;
            font-size: 14px;
            margin-bottom: 8px;
            white-space: pre-wrap;
            line-height: 1.4;
        }
        .message-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            margin-top: 4px;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 6px;
        }
        .reactions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .action-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #333;
            color: #ccc;
            cursor: pointer;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 3px;
            padding: 3px 8px;
            border-radius: 6px;
        }
        .action-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .donate-msg-btn {
            color: #64b5f6;
            background: rgba(0, 136, 204, 0.15);
            border-color: rgba(0, 136, 204, 0.3);
            font-weight: bold;
        }
        .pm-btn {
            color: #ffd54f;
            background: rgba(255, 213, 79, 0.15);
            border-color: rgba(255, 213, 79, 0.3);
            font-weight: bold;
        }
        #reply-preview-container {
            display: none;
            background: #252830;
            padding: 8px 12px;
            border-top: 1px solid #333;
            font-size: 12px;
            color: #b0bec5;
            justify-content: space-between;
            align-items: center;
        }
        #reply-preview-container.active {
            display: flex;
        }
        .cancel-reply {
            background: none;
            border: none;
            color: #ff5252;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
        .input-container {
            padding: 10px 12px;
            background: #1f1f1f;
            display: flex;
            gap: 10px;
            border-top: 1px solid #333;
            align-items: center;
        }
        .input-container textarea {
            flex: 1;
            padding: 10px;
            background: #2c2c2c;
            border: 1px solid #444;
            color: #fff;
            border-radius: 8px;
            font-size: 14px;
            resize: none;
            height: 40px;
            font-family: inherit;
        }
        .input-container button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 0 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            height: 42px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>📖 ЖЖ (Живий журнал)</h1>
        <div class="header-actions">
            <div id="ton-connect-btn"></div>
        </div>
    </div>

    <div id="chat-container">
        <!-- Повідомлення -->
    </div>

    <div id="reply-preview-container">
        <div><span id="reply-label">↩️ Відповідь на:</span> <span id="reply-to-author" style="font-weight: bold; color: #64b5f6;"></span></div>
        <button class="cancel-reply" onclick="cancelReply()">✕</button>
    </div>

    <div class="input-container">
        <textarea id="message-input" placeholder="Напишіть вірш або думку... ✍️"></textarea>
        <button id="send-btn" onclick="sendMessage()">Опублікувати</button>
    </div>

    <script>
        const OWNER_WALLET = "UQDXq1iAqu88tVRG62_k03kAXELu_1gzRBMye-VZoFRIRtWw";

        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        const tgUser = tg?.initDataUnsafe?.user;
        const myTelegramName = tgUser ? (tgUser.first_name + (tgUser.last_name ? ' ' + tgUser.last_name : '')) : 'Михайло';

        const SUPABASE_URL = 'https://hsboeykzidkilprcpyey.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_itYl4wIpMrcdLLHyeaEoXw_7ajw1483';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://gansgajder-web.github.io/Para/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-btn',
            actionsConfiguration: {
                twaReturnUrl: 'https://t.me/walt'
            }
        });

        let connectedAddress = null;
        let replyingToId = null;
        let isPrivateMode = false;

        tonConnectUI.onStatusChange(wallet => {
            if (wallet) {
                connectedAddress = wallet.account.address;
            } else {
                connectedAddress = null;
            }
            loadMessages();
        });

        function formatAddress(addr) {
            if (!addr) return "";
            return addr.substring(0, 4) + '...' + addr.substring(addr.length - 4);
        }

        function getRandomColor(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            const colors = ['#e53935', '#d81b60', '#8e24aa', '#5e35b1', '#3949ab', '#1e88e5', '#00897b', '#43a047', '#fb8c00'];
            return colors[Math.abs(hash) % colors.length];
        }

        function formatTime(dateString) {
            if (!dateString) return "";
            const date = new Date(dateString);
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        async function loadMessages() {
            const container = document.getElementById('chat-container');
            const { data, error } = await supabaseClient
                .from('messages')
                .select('*')
                .order('id', { ascending: true });

            if (error) return;

            const messagesMap = {};
            if (data) {
                data.forEach(msg => messagesMap[msg.id] = msg);
            }

            container.innerHTML = '';
            if (data) {
                data.forEach(msg => {
                    if (msg.is_private) {
                        const isSender = connectedAddress && msg.author_wallet === connectedAddress;
                        const isOwner = connectedAddress === OWNER_WALLET;
                        
                        let isRecipient = false;
                        if (msg.reply_to && messagesMap[msg.reply_to]) {
                            const parentMsg = messagesMap[msg.reply_to];
                            if (connectedAddress && parentMsg.author_wallet === connectedAddress) {
                                isRecipient = true;
                            }
                        }

                        if (!isSender && !isOwner && !isRecipient) {
                            return;
                        }
                    }

                    const div = document.createElement('div');
                    div.className = msg.is_private ? 'message private-msg' : 'message';
                    div.id = `msg-${msg.id}`;

                    const authorName = msg.author || 'Михайло';

                    const avatar = document.createElement('div');
                    avatar.className = 'avatar';
                    avatar.style.backgroundColor = getRandomColor(authorName);
                    avatar.innerText = authorName[0].toUpperCase();

                    const content = document.createElement('div');
                    content.className = 'msg-content';

                    const headerRow = document.createElement('div');
                    headerRow.className = 'msg-header-row';

                    const author = document.createElement('div');
                    author.className = 'username';
                    author.innerText = msg.is_private ? `🔒 [Приватне] ${authorName}` : authorName;

                    const timeSpan = document.createElement('div');
                    timeSpan.className = 'msg-time';
                    timeSpan.innerText = formatTime(msg.created_at);

                    headerRow.appendChild(author);
                    headerRow.appendChild(timeSpan);

                    content.appendChild(headerRow);

                    if (msg.reply_to && messagesMap[msg.reply_to]) {
                        const parentMsg = messagesMap[msg.reply_to];
                        const quoteDiv = document.createElement('div');
                        quoteDiv.className = 'reply-quote';
                        
                        const quoteAuthor = document.createElement('div');
                        quoteAuthor.className = 'reply-quote-author';
                        quoteAuthor.innerText = parentMsg.author || 'Учасник';

                        const quoteText = document.createElement('div');
                        quoteText.innerText = parentMsg.text ? (parentMsg.text.length > 60 ? parentMsg.text.substring(0, 60) + '...' : parentMsg.text) : '';

                        quoteDiv.appendChild(quoteAuthor);
                        quoteDiv.appendChild(quoteText);
                        
                        quoteDiv.onclick = () => scrollToMessage(msg.reply_to);
                        quoteDiv.style.cursor = 'pointer';

                        content.appendChild(quoteDiv);
                    }

                    const text = document.createElement('div');
                    text.className = 'message-text';
                    
                    let rawText = msg.text || '';
                    const urlRegex = /(https?:\/\/[^\s]+)/g;
                    text.innerHTML = rawText.replace(urlRegex, '<a href="$1" target="_blank" style="color: #64b5f6; text-decoration: underline;">$1</a>');
                    
                    content.appendChild(text);

                    const footer = document.createElement('div');
                    footer.className = 'message-footer';

                    const reactions = document.createElement('div');
                    reactions.className = 'reactions';

                    const likesCount = msg.likes || 0;
                    const likeBtn = document.createElement('button');
                    likeBtn.className = 'action-btn';
                    likeBtn.innerHTML = `👍 <span>${likesCount}</span>`;
                    likeBtn.onclick = () => updateReaction(msg.id, 'likes', likesCount + 1);

                    const dislikesCount = msg.dislikes || 0;
                    const dislikeBtn = document.createElement('button');
                    dislikeBtn.className = 'action-btn';
                    dislikeBtn.innerHTML = `👎 <span>${dislikesCount}</span>`;
                    dislikeBtn.onclick = () => updateReaction(msg.id, 'dislikes', dislikesCount + 1);

                    const replyBtn = document.createElement('button');
                    replyBtn.className = 'action-btn';
                    replyBtn.innerHTML = `↩️ Відповісти`;
                    replyBtn.onclick = () => setReplyTo(msg.id, authorName, false);

                    const pmBtn = document.createElement('button');
                    pmBtn.className = 'action-btn pm-btn';
                    pmBtn.innerHTML = `📩 Приватне`;
                    pmBtn.onclick = () => startPrivateMessage(msg.id, authorName);

                    const shareBtn = document.createElement('button');
                    shareBtn.className = 'action-btn';
                    shareBtn.innerHTML = `🔗 Поділитися`;
                    shareBtn.onclick = () => sharePost(msg.id);

                    reactions.appendChild(likeBtn);
                    reactions.appendChild(dislikeBtn);
                    reactions.appendChild(replyBtn);
                    reactions.appendChild(pmBtn);
                    reactions.appendChild(shareBtn);

                    // Безпечний донат на OWNER_WALLET, щоб гаманець не видавав помилку скасування на сиру адресу
                    const donateBtn = document.createElement('button');
                    donateBtn.className = 'action-btn donate-msg-btn';
                    donateBtn.innerHTML = `💸 0.01 TON`;
                    donateBtn.onclick = () => handleDonate(OWNER_WALLET, "10000000");

                    footer.appendChild(reactions);
                    footer.appendChild(donateBtn);
                    content.appendChild(footer);

                    div.appendChild(avatar);
                    div.appendChild(content);
                    container.appendChild(div);
                });
                
                checkUrlHash();
            }
        }

        function setReplyTo(id, authorName, privateFlag = false) {
            replyingToId = id;
            isPrivateMode = privateFlag;
            document.getElementById('reply-label').innerText = privateFlag ? "📩 Приватне повідомлення для:" : "↩️ Відповідь на:";
            document.getElementById('reply-to-author').innerText = authorName;
            document.getElementById('reply-preview-container').classList.add('active');
            document.getElementById('message-input').focus();
        }

        async function startPrivateMessage(msgId, authorName) {
            if (!tonConnectUI.connected) {
                if (tg?.showAlert) tg.showAlert("Підключіть гаманець TON для оплати приватного повідомлення (0.01 TON).");
                return;
            }
            
            const success = await handleDonate(OWNER_WALLET, "10000000");
            if (success) {
                setReplyTo(msgId, authorName, true);
            }
        }

        function cancelReply() {
            replyingToId = null;
            isPrivateMode = false;
            document.getElementById('reply-preview-container').classList.remove('active');
        }

        function scrollToMessage(id) {
            const el = document.getElementById(`msg-${id}`);
            if (el) {
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                el.classList.add('highlight');
                setTimeout(() => el.classList.remove('highlight'), 3000);
            }
        }

        function sharePost(msgId) {
            const currentUrl = window.location.href.split('#')[0] + `#msg-${msgId}`;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(currentUrl);
            }
            if (tg?.showAlert) {
                tg.showAlert(`Посилання на цей допис скопійовано!\n\n${currentUrl}`);
            } else {
                alert(`Посилання скопійовано: ${currentUrl}`);
            }
        }

        function checkUrlHash() {
            const hash = window.location.hash;
            if (hash) {
                const targetElement = document.querySelector(hash);
                if (targetElement) {
                    targetElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    targetElement.classList.add('highlight');
                    setTimeout(() => targetElement.classList.remove('highlight'), 3000);
                }
            } else {
                const container = document.getElementById('chat-container');
                container.scrollTop = container.scrollHeight;
            }
        }

        async function sendMessage() {
            const input = document.getElementById('message-input');
            const btn = document.getElementById('send-btn');
            const text = input.value.trim();
            if (!text) return;

            btn.disabled = true;

            let authorName = myTelegramName;
            if (connectedAddress) {
                authorName = `${myTelegramName} (${formatAddress(connectedAddress)})`;
            }

            const insertData = {
                text: text,
                likes: 0,
                dislikes: 0,
                author: authorName,
                author_wallet: connectedAddress || null,
                is_private: isPrivateMode
            };

            if (replyingToId) {
                insertData.reply_to = replyingToId;
            }

            const { error } = await supabaseClient
                .from('messages')
                .insert([insertData]);

            input.value = '';
            btn.disabled = false;
            cancelReply();
            await loadMessages();
        }

        async function updateReaction(id, field, newValue) {
            const updateObj = {};
            updateObj[field] = newValue;
            const { error } = await supabaseClient
                .from('messages')
                .update(updateObj)
                .eq('id', id);

            if (!error) loadMessages();
        }

        async function handleDonate(walletAddress, nanoAmount) {
            if (!tonConnectUI.connected) {
                if (tg?.showAlert) tg.showAlert("Підключіть гаманець TON.");
                return false;
            }

            try {
                const transaction = {
                    validUntil: Math.floor(Date.now() / 1000) + 60,
                    messages: [
                        {
                            address: walletAddress,
                            amount: nanoAmount
                        }
                    ]
                };
                await tonConnectUI.sendTransaction(transaction);
                return true;
            } catch (e) {
                console.log("Скасовано або помилка", e);
                return false;
            }
        }

        loadMessages();
    </script>
</body>
</html>
