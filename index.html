<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Para Content Hub</title>
    <style>
        body { background: #121212; color: #eee; font-family: sans-serif; padding: 20px; }
        .box { background: #1e1e1e; padding: 20px; border-radius: 12px; margin-bottom: 15px; }
        h2 { color: #00e676; }
        .news { white-space: pre-wrap; color: #fff; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Свіжий контент</h2>
        <div id="content" class="news">Завантаження новин...</div>
    </div>
    <script>
        fetch('content.txt')
            .then(r => r.text())
            .then(t => document.getElementById('content').innerText = t);
    </script>
</body>
</html>
