<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PapaChat</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .header {
            background-color: #1f1f1f;
            color: #ffffff;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }
        .header h1 {
            margin: 0;
            font-size: 18px;
        }
        .header-buttons {
            display: flex;
            gap: 8px;
        }
        .header button {
            background-color: #333;
            color: #ffffff;
            border: 1px solid #555;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }
        #chat-container {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            background: #1e1e1e;
            padding: 10px 12px;
            border-radius: 10px;
            max-width: 85%;
            border: 1px solid #2a2a2a;
            display: flex;
            gap: 10px;
        }
        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #007bff;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            flex-shrink: 0;
            background-size: cover;
            background-position: center;
        }
        .msg-content {
            flex: 1;
        }
        .username {
            font-size: 12px;
            font-weight: bold;
            color: #64b5f6;
            margin-bottom: 4px;
        }
        .message-text {
            word-break: break-word;
            font-size: 14px;
            margin-bottom: 6px;
        }
        .message-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            margin-top: 4px;
        }
        .action-btn {
            background: none;
            border: none;
            color: #ff5252;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .donate-msg-btn {
            color: #0088cc;
            background: rgba(0, 136, 204, 0.1);
        }
        .input-container {
            padding: 12px;
            background: #1f1f1f;
            display: flex;
            gap: 10px;
            border-top: 1px solid #333;
        }
        .input-container input {
            flex: 1;
            padding: 12px;
            background: #2c2c2c;
            border: 1px solid #444;
            color: #fff;
            border-radius: 8px;
            font-size: 15px;
        }
        .input-container button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>PapaChat</h1>
        <div class="header-buttons">
            <button onclick="donateTon('UQDXq1iAqu88tVRG62_k03kAXELu_1gzRBMye-VZoFRIRtWw')">💎 Чат-фонд</button>
            <button onclick="location.reload()">Оновити</button>
        </div>
    </div>

    <div id="chat-container">
        <!-- Повідомлення -->
    </div>

    <div class="input-container">
        <input type="text" id="message-input" placeholder="Напишіть повідомлення 💬...">
        <button onclick="sendMessage()">Надіслати</button>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        const tgUser = tg?.initDataUnsafe?.user;
        const userName = tgUser ? (tgUser.first_name + (tgUser.last_name ? ' ' + tgUser.last_name : '')) : 'Гість';
        const userPhoto = tgUser?.photo_url || null;

        const SUPABASE_URL = 'https://hsboeykzidkilprcpyey.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_itYl4wIpMrcdLLHyeaEoXw_7ajw1483';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadMessages() {
            const container = document.getElementById('chat-container');
            const { data, error } = await supabaseClient
                .from('messages')
                .select('*')
                .order('id', { ascending: true });

            if (error) {
                console.error('Помилка завантаження:', error);
                return;
            }

            container.innerHTML = '';
            if (data) {
                data.forEach(msg => {
                    const div = document.createElement('div');
                    div.className = 'message';

                    // Аватар
                    const avatar = document.createElement('div');
                    avatar.className = 'avatar';
                    if (msg.photo_url) {
                        avatar.style.backgroundImage = `url('${msg.photo_url}')`;
                    } else {
                        avatar.innerText = (msg.author || 'Г')[0].toUpperCase();
                    }

                    // Контент
                    const content = document.createElement('div');
                    content.className = 'msg-content';

                    const author = document.createElement('div');
                    author.className = 'username';
                    author.innerText = msg.author || 'Анонім';

                    const text = document.createElement('div');
                    text.className = 'message-text';
                    text.innerText = msg.text || '';

                    const footer = document.createElement('div');
                    footer.className = 'message-footer';

                    // Кнопка Лайка
                    const likesCount = msg.likes || 0;
                    const likeBtn = document.createElement('button');
                    likeBtn.className = 'action-btn';
                    likeBtn.innerHTML = `❤️ <span>${likesCount}</span>`;
                    likeBtn.onclick = () => addLike(msg.id, likesCount);

                    // Кнопка Допомоги автору
                    const helpBtn = document.createElement('button');
                    helpBtn.className = 'action-btn donate-msg-btn';
                    helpBtn.innerHTML = `💸 Підтримати`;
                    helpBtn.onclick = () => donateToAuthor(msg.author, msg.wallet || "UQDXq1iAqu88tVRG62_k03kAXELu_1gzRBMye-VZoFRIRtWw");

                    footer.appendChild(likeBtn);
                    footer.appendChild(helpBtn);

                    content.appendChild(author);
                    content.appendChild(text);
                    content.appendChild(footer);

                    div.appendChild(avatar);
                    div.appendChild(content);
                    container.appendChild(div);
                });
                container.scrollTop = container.scrollHeight;
            }
        }

        async function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;

            const { error } = await supabaseClient
                .from('messages')
                .insert([{
                    text: text,
                    likes: 0,
                    author: userName,
                    photo_url: userPhoto
                }]);

            if (error) {
                await supabaseClient.from('messages').insert([{ text: text, likes: 0 }]);
            }
            
            input.value = '';
            loadMessages();
        }

        async function addLike(id, currentLikes) {
            const { error } = await supabaseClient
                .from('messages')
                .update({ likes: currentLikes + 1 })
                .eq('id', id);

            if (!error) loadMessages();
        }

        function donateToAuthor(authorName, wallet) {
            if (navigator.clipboard) {
                navigator.clipboard.writeText(wallet);
            }
            
            const message = `Скопійовано TON-гаманець для підтримки ${authorName}:\n\n${wallet}`;
            if (tg?.showAlert) {
                tg.showAlert(message);
            } else {
                alert(message);
            }
        }

        function donateTon(wallet) {
            donateToAuthor("Чат-фонд", wallet);
        }

        loadMessages();
    </script>
</body>
</html>
