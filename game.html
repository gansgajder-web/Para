<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ігрова Зала — ЖЖ</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- TON Connect UI SDK -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 10px;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .header {
            width: 100%;
            max-width: 420px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .header h1 {
            margin: 0;
            font-size: 18px;
            color: #ffb74d;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #ton-connect-btn {
            transform: scale(0.8);
            transform-origin: right center;
        }
        /* Перемикач ігор */
        .game-switcher {
            display: flex;
            gap: 6px;
            width: 100%;
            max-width: 420px;
            margin-bottom: 15px;
        }
        .switch-btn {
            flex: 1;
            background: #1e1e1e;
            border: 1px solid #333;
            color: #aaa;
            padding: 8px 2px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
            text-align: center;
            transition: all 0.2s;
        }
        .switch-btn.active {
            background: #ffb74d;
            color: #121212;
            border-color: #ffb74d;
        }
        /* Ігрові контейнери */
        .game-card {
            display: none;
            width: 100%;
            max-width: 420px;
            background: #1e1e1e;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #333;
            text-align: center;
            box-sizing: border-box;
        }
        .game-card.active {
            display: block;
        }
        .status-text {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #64b5f6;
            min-height: 18px;
        }
        
        /* Хрестики-нулики — сітка 3х3 */
        .ttt-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 240px;
            margin: 0 auto 15px auto;
        }
        .ttt-cell {
            background: #252830;
            width: 72px;
            height: 72px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
            border: 1px solid #333;
        }
        .ttt-cell.x { color: #ff5252; }
        .ttt-cell.o { color: #64b5f6; }

        /* Морський бій сітка 10х10 */
        .battleship-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .fleet-box {
            background: #161616;
            padding: 6px;
            border-radius: 8px;
            border: 1px solid #2a2a2a;
        }
        .fleet-title {
            font-size: 11px;
            color: #888;
            margin-bottom: 4px;
        }
        .bs-board {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 2px;
            max-width: 100%;
            margin: 0 auto;
        }
        .bs-cell {
            background: #252830;
            aspect-ratio: 1;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            cursor: pointer;
            border: 1px solid #222;
        }

        /* Загальні кнопки */
        .btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            margin-top: 5px;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        
        /* Камінь-ножиці */
        .rps-choices {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
        }
        .rps-btn {
            background: #252830;
            border: 1px solid #444;
            font-size: 26px;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
        }
        
        .back-link {
            display: inline-block;
            margin-top: 15px;
            color: #ffb74d;
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🕹️ Ігрова Зала</h1>
        <div class="header-actions">
            <div id="ton-connect-btn"></div>
        </div>
    </div>

    <!-- Перемикач ігор -->
    <div class="game-switcher">
        <div class="switch-btn active" onclick="switchGame(0)">❌ Хрестики</div>
        <div class="switch-btn" onclick="switchGame(1)">🚢 Морський бій</div>
        <div class="switch-btn" onclick="switchGame(2)">✂️ Камінь-Ножиці</div>
    </div>

    <!-- Гра 1: Хрестики-нулики (Розумний бот) -->
    <div id="game-0" class="game-card active">
        <div class="status-text" id="ttt-status">Ваш хід (X)</div>
        <div class="ttt-board" id="ttt-board">
            <div class="ttt-cell" onclick="makeMove(0)"></div>
            <div class="ttt-cell" onclick="makeMove(1)"></div>
            <div class="ttt-cell" onclick="makeMove(2)"></div>
            <div class="ttt-cell" onclick="makeMove(3)"></div>
            <div class="ttt-cell" onclick="makeMove(4)"></div>
            <div class="ttt-cell" onclick="makeMove(5)"></div>
            <div class="ttt-cell" onclick="makeMove(6)"></div>
            <div class="ttt-cell" onclick="makeMove(7)"></div>
            <div class="ttt-cell" onclick="makeMove(8)"></div>
        </div>
        <button class="btn" onclick="resetTTT()">Нова гра</button>
    </div>

    <!-- Гра 2: Морський бій -->
    <div id="game-1" class="game-card">
        <div class="status-text" id="bs-status">Розставте свої кораблі (виберіть 5 клітинок)</div>
        <div class="battleship-container">
            <!-- Вороже поле -->
            <div class="fleet-box" id="enemy-box" style="display:none;">
                <div class="fleet-title">🎯 Ворожа акваторія</div>
                <div class="bs-board" id="enemy-board"></div>
            </div>
            <!-- Поле гравця для розстановки -->
            <div class="fleet-box">
                <div class="fleet-title" id="player-box-title">⚓ Ваша акваторія (натисніть, щоб сховати корабель)</div>
                <div class="bs-board" id="player-board"></div>
            </div>
        </div>
        <button class="btn" id="bs-action-btn" onclick="startBattle()" style="display:none; margin-top: 8px;">Розпочати бій!</button>
        <button class="btn" onclick="resetBattleship()" style="margin-top: 8px;">Скинути бій</button>
    </div>

    <!-- Гра 3: Камінь, ножиці, папір -->
    <div id="game-2" class="game-card">
        <div class="status-text">✂️ Камінь, ножиці, папір</div>
        <div style="font-size: 12px; color: #888; margin-bottom: 10px;">Рахунок: Ви <span id="p-score">0</span> : <span id="b-score">0</span> Бот</div>
        <div id="rps-result" style="font-size: 13px; margin-bottom: 10px; color: #fff;">Оберіть жест:</div>
        <div class="rps-choices">
            <button class="rps-btn" onclick="playRPS('rock')">✊</button>
            <button class="rps-btn" onclick="playRPS('paper')">✋</button>
            <button class="rps-btn" onclick="playRPS('scissors')">✌️</button>
        </div>
    </div>

    <a href="index.html" class="back-link">← Повернутися до Живого журналу</a>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.expand(); tg.ready(); }

        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://gansgajder-web.github.io/Para/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-btn',
            actionsConfiguration: {
                twaReturnUrl: 'https://t.me/walt'
            }
        });

        // Аудіо-синтезатор
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'shot') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'hit') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(500, audioCtx.currentTime);
                osc.frequency.setValueAtTime(200, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'miss') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(60, audioCtx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            }
        }

        function switchGame(index) {
            const cards = document.querySelectorAll('.game-card');
            const btns = document.querySelectorAll('.switch-btn');
            cards.forEach((c, i) => c.classList.toggle('active', i === index));
            btns.forEach((b, i) => b.classList.toggle('active', i === index));
        }

        // --- ХРЕСТИКИ-НУЛИКИ (НЕПЕРЕМОЖНИЙ АЛГОРИТМ) ---
        let tttBoard = ['', '', '', '', '', '', '', '', ''];
        let tttActive = true, tttTurn = true;

        function makeMove(i) {
            if (!tttActive || !tttTurn || tttBoard[i] !== '') return;
            tttBoard[i] = 'X';
            playSound('shot');
            updateTTT();

            if (checkWin('X')) { 
                document.getElementById('ttt-status').innerText = 'Ви перемогли! 🎉'; 
                tttActive = false; 
                return; 
            }
            if (tttBoard.every(c => c !== '')) { 
                document.getElementById('ttt-status').innerText = 'Нічия! 🤝'; 
                tttActive = false; 
                return; 
            }

            tttTurn = false;
            document.getElementById('ttt-status').innerText = 'Хід бота... 🤖';
            setTimeout(botTTT, 400);
        }

        function getSmartBotMove() {
            const winCombos = [
                [0,1,2],[3,4,5],[6,7,8],
                [0,3,6],[1,4,7],[2,5,8],
                [0,4,8],[2,4,6]
            ];

            // 1. Спроба перемогти бота (якщо 2 нулики в ряд і є 3-я вільна)
            for (let combo of winCombos) {
                let oCount = combo.filter(idx => tttBoard[idx] === 'O').length;
                let emptyCount = combo.filter(idx => tttBoard[idx] === '').length;
                if (oCount === 2 && emptyCount === 1) {
                    return combo.find(idx => tttBoard[idx] === '');
                }
            }

            // 2. БЛОКУВАННЯ ГРАВЦЯ (якщо у гравця 2 хрестики в ряд — ОБОВ'ЯЗКОВО БЛОКУЄМО!)
            for (let combo of winCombos) {
                let xCount = combo.filter(idx => tttBoard[idx] === 'X').length;
                let emptyCount = combo.filter(idx => tttBoard[idx] === '').length;
                if (xCount === 2 && emptyCount === 1) {
                    return combo.find(idx => tttBoard[idx] === '');
                }
            }

            // 3. Заняти центр, якщо вільний
            if (tttBoard[4] === '') return 4;

            // 4. Заняти кути
            const corners = [0, 2, 6, 8].filter(idx => tttBoard[idx] === '');
            if (corners.length > 0) {
                return corners[Math.floor(Math.random() * corners.length)];
            }

            // 5. Будь-яка вільна клітинка
            let empty = tttBoard.map((v, idx) => v === '' ? idx : null).filter(v => v !== null);
            return empty[Math.floor(Math.random() * empty.length)];
        }

        function botTTT() {
            if (!tttActive) return;
            let moveIdx = getSmartBotMove();
            if (moveIdx !== undefined && moveIdx !== null) {
                tttBoard[moveIdx] = 'O';
                playSound('hit');
            }
            updateTTT();

            if (checkWin('O')) { 
                document.getElementById('ttt-status').innerText = 'Переміг Бот! 🤖'; 
                tttActive = false; 
                return; 
            }
            if (tttBoard.every(c => c !== '')) { 
                document.getElementById('ttt-status').innerText = 'Нічия! 🤝'; 
                tttActive = false; 
                return; 
            }

            tttTurn = true;
            document.getElementById('ttt-status').innerText = 'Ваш хід (X)';
        }

        function updateTTT() {
            const cells = document.getElementById('ttt-board').children;
            for(let i=0; i<9; i++) {
                cells[i].innerText = tttBoard[i];
                cells[i].className = 'ttt-cell ' + (tttBoard[i] === 'X' ? 'x' : tttBoard[i] === 'O' ? 'o' : '');
            }
        }

        function checkWin(p) {
            const w = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            return w.some(c => c.every(i => tttBoard[i] === p));
        }

        function resetTTT() {
            tttBoard = ['', '', '', '', '', '', '', '', ''];
            tttActive = true; 
            tttTurn = true;
            document.getElementById('ttt-status').innerText = 'Ваш хід (X)';
            updateTTT();
        }

        // --- МОРСЬКИЙ БІЙ ---
        let playerShips = [];
        let enemyShips = [];
        let gameStage = 'setup';
        let playerHits = 0, enemyHits = 0;

        function initBoards() {
            const pBoard = document.getElementById('player-board');
            const eBoard = document.getElementById('enemy-board');
            pBoard.innerHTML = '';
            eBoard.innerHTML = '';

            for(let i=0; i<100; i++) {
                let pCell = document.createElement('div');
                pCell.className = 'bs-cell';
                pCell.innerText = '·';
                pCell.onclick = () => handleSetupClick(i);
                pBoard.appendChild(pCell);

                let eCell = document.createElement('div');
                eCell.className = 'bs-cell';
                eCell.innerText = '·';
                eCell.onclick = () => playerShoot(i);
                eBoard.appendChild(eCell);
            }
        }

        function handleSetupClick(i) {
            if (gameStage !== 'setup') return;
            if (playerShips.includes(i)) {
                playerShips = playerShips.filter(pos => pos !== i);
                document.getElementById('player-board').children[i].innerText = '·';
            } else if (playerShips.length < 5) {
                playerShips.push(i);
                document.getElementById('player-board').children[i].innerText = '🚢';
                playSound('shot');
            }

            if (playerShips.length === 5) {
                document.getElementById('bs-action-btn').style.display = 'inline-block';
                document.getElementById('bs-status').innerText = 'Кораблі розставлені! Натисніть "Розпочати бій!"';
            } else {
                document.getElementById('bs-status').innerText = `Розставте кораблі: обрано ${playerShips.length} з 5`;
            }
        }

        function startBattle() {
            if (playerShips.length < 5) return;
            gameStage = 'battle';
            document.getElementById('bs-action-btn').style.display = 'none';
            document.getElementById('enemy-box').style.display = 'block';
            document.getElementById('player-box-title').innerText = '⚓ Ваша флотилія';
            
            enemyShips = [];
            while(enemyShips.length < 5) {
                let pos = Math.floor(Math.random() * 100);
                if(!enemyShips.includes(pos)) enemyShips.push(pos);
            }
            document.getElementById('bs-status').innerText = 'Бій почався! Стріляйте по ворогу!';
        }

        function playerShoot(i) {
            if (gameStage !== 'battle') return;
            const eCells = document.getElementById('enemy-board').children;
            if (eCells[i].innerText === '💥' || eCells[i].innerText === '💧') return;

            playSound('shot');
            if (enemyShips.includes(i)) {
                eCells[i].innerText = '💥';
                eCells[i].style.background = '#e53935';
                playSound('hit');
                playerHits++;
                if (playerHits === 5) {
                    document.getElementById('bs-status').innerText = 'Перемога! Ви знищили всю ворожу флотилію! 🎉';
                    gameStage = 'over';
                    return;
                } else {
                    document.getElementById('bs-status').innerText = 'Влучання! Зробіть ще постріл!';
                }
            } else {
                eCells[i].innerText = '💧';
                eCells[i].style.background = '#1e88e5';
                playSound('miss');
                document.getElementById('bs-status').innerText = 'Мимо! Хід ворога...';
                setTimeout(botShoot, 600);
            }
        }

        function botShoot() {
            if (gameStage !== 'battle') return;
            let available = [];
            const pCells = document.getElementById('player-board').children;
            for(let i=0; i<100; i++) {
                if(pCells[i].innerText !== '💥' && pCells[i].innerText !== '❌') available.push(i);
            }
            if(available.length === 0) return;
            let target = available[Math.floor(Math.random() * available.length)];

            if(playerShips.includes(target)) {
                pCells[target].innerText = '💥';
                pCells[target].style.background = '#e53935';
                playSound('hit');
                enemyHits++;
                if(enemyHits === 5) {
                    document.getElementById('bs-status').innerText = 'Бій програно! Ворог знищив ваші кораблі 🤖';
                    gameStage = 'over';
                } else {
                    document.getElementById('bs-status').innerText = 'Ворог влучив у ваш корабель! Ваш хід!';
                }
            } else {
                pCells[target].innerText = '❌';
                playSound('miss');
                document.getElementById('bs-status').innerText = 'Ворог промахнувся! Ваш хід!';
            }
        }

        function resetBattleship() {
            playerShips = [];
            enemyShips = [];
            gameStage = 'setup';
            playerHits = 0;
            enemyHits = 0;
            document.getElementById('enemy-box').style.display = 'none';
            document.getElementById('bs-action-btn').style.display = 'none';
            document.getElementById('player-box-title').innerText = '⚓ Ваша акваторія (натисніть, щоб сховати корабель)';
            document.getElementById('bs-status').innerText = 'Розставте свої кораблі (виберіть 5 клітинок)';
            initBoards();
        }

        initBoards();

        // --- КАМІНЬ, НОЖИЦІ, ПАПІР ---
        let pS = 0, bS = 0;
        const emojis = { rock: '✊', paper: '✋', scissors: '✌️' };
        function playRPS(choice) {
            playSound('shot');
            const arr = ['rock', 'paper', 'scissors'];
            const bot = arr[Math.floor(Math.random()*3)];
            let res = '';
            if (choice === bot) res = `Нічия (${emojis[choice]})`;
            else if ((choice==='rock'&&bot==='scissors')||(choice==='paper'&&bot==='rock')||(choice==='scissors'&&bot==='paper')) {
                pS++; res = `Ви виграли! (${emojis[choice]} б'є ${emojis[bot]})`;
            } else {
                bS++; res = `Бот виграв! (${emojis[bot]} б'є ${emojis[choice]})`;
            }
            document.getElementById('p-score').innerText = pS;
            document.getElementById('b-score').innerText = bS;
            document.getElementById('rps-result').innerText = res;
        }
    </script>
</body>
</html>
