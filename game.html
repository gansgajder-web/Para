<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пасіка Ідей — Секретна кімната</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-top: 10px;
        }

        .header h1 {
            font-size: 20px;
            color: #ffc107;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 13px;
            color: #aaa;
        }

        /* Ігрова зона з вуликом */
        .game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            width: 100%;
        }

        .score-board {
            font-size: 24px;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .hive-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 90px;
            transition: transform 0.1s ease;
            outline: none;
            user-select: none;
            position: relative;
        }

        .hive-btn:active {
            transform: scale(0.9);
        }

        .level-info {
            margin-top: 20px;
            font-size: 14px;
            color: #64b5f6;
            background: rgba(100, 181, 246, 0.1);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(100, 181, 246, 0.2);
        }

        /* Анімація появи крапель нектару при кліку */
        .floating-text {
            position: absolute;
            font-weight: bold;
            color: #ffeb3b;
            font-size: 18px;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-60px) scale(1.2);
            }
        }

        /* Нижня кнопка повернення */
        .footer {
            width: 100%;
            max-width: 400px;
            margin-bottom: 10px;
        }

        .back-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #1e1e1e;
            color: #ffc107;
            text-align: center;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            border: 1px solid #333;
            transition: background 0.2s;
        }

        .back-btn:hover {
            background-color: #2c2c2c;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🐝 Пасіка Ідей</h1>
        <p>Збирайте натхнення та нектар із вулика!</p>
    </div>

    <div class="game-area">
        <div class="score-board" id="score">🍯 0 крапель</div>
        
        <div style="position: relative;">
            <button class="hive-btn" id="hive" onclick="collectHoney(event)">🍯</button>
        </div>

        <div class="level-info" id="level-text">Рівень: Новачок-бджоляр 🌱</div>
    </div>

    <div class="footer">
        <a href="index.html" class="back-btn">← Повернутися до Живого журналу</a>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        // Зберігаємо бали в пам'яті браузера (localStorage)
        let honeyCount = parseInt(localStorage.getItem('honey_score')) || 0;
        const scoreEl = document.getElementById('score');
        const levelEl = document.getElementById('level-text');

        updateDisplay();

        function collectHoney(event) {
            honeyCount++;
            localStorage.setItem('honey_score', honeyCount);
            updateDisplay();

            // Створюємо ефект летить краплі при кліку
            createFloatingText(event);
        }

        function updateDisplay() {
            scoreEl.innerText = `🍯 ${honeyCount} крапель`;

            // Визначаємо рівень залежно від кількості балів
            let levelTitle = "Новачок-бджоляр 🌱";
            if (honeyCount >= 50) levelTitle = "Вправний пасічник 🌿";
            if (honeyCount >= 150) levelTitle = "Майстер медового слова 🍯👑";
            if (honeyCount >= 300) levelTitle = "Легендарний Гуру Бджіл 🐝⚡";

            levelEl.innerText = `Рівень: ${levelTitle}`;
        }

        function createFloatingText(event) {
            const rect = event.target.getBoundingClientRect();
            const x = event.clientX || (rect.left + rect.width / 2);
            const y = event.clientY || (rect.top);

            const el = document.div || document.createElement('div');
            el.className = 'floating-text';
            el.innerText = '+1 🍯';
            el.style.left = `${x - 15}px`;
            el.style.top = `${y - 30}px`;

            document.body.appendChild(el);

            setTimeout(() => {
                el.remove();
            }, 800);
        }
    </script>
</body>
</html>
