<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>НЕ НАТИСКАТИ!</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- TON Connect UI SDK -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #111;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 15px;
            overflow: hidden;
            text-align: center;
        }

        /* Шапка з підключенням гаманця */
        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid #222;
        }

        .header h2 {
            font-size: 16px;
            color: #ff5252;
        }

        #ton-connect-btn {
            transform: scale(0.85);
            transform-origin: right center;
        }

        /* Зона з кнопкою */
        .main-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            width: 100%;
        }

        .warning-text {
            font-size: 18px;
            font-weight: bold;
            color: #ffcc00;
            margin-bottom: 30px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 10px;
        }

        /* Величезна Червона Кнопка */
        .big-red-button {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ff5252, #b71c1c);
            border: 6px solid #d32f2f;
            box-shadow: 0 10px 25px rgba(255, 0, 0, 0.5), inset 0 5px 10px rgba(255, 255, 255, 0.4);
            cursor: pointer;
            outline: none;
            font-size: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.05s, box-shadow 0.05s;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .big-red-button:active {
            transform: scale(0.92);
            box-shadow: 0 2px 10px rgba(255, 0, 0, 0.8), inset 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        .counter-badge {
            margin-top: 25px;
            font-size: 14px;
            color: #888;
            background: #1e1e1e;
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid #333;
        }

        /* Ефект трусіння екрана */
        .shake {
            animation: shakeAnim 0.3s ease-in-out;
        }

        @keyframes shakeAnim {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-8px, 5px); }
            40% { transform: translate(8px, -5px); }
            60% { transform: translate(-5px, 3px); }
            80% { transform: translate(5px, -3px); }
            100% { transform: translate(0, 0); }
        }

        /* Повернення */
        .footer {
            width: 100%;
            max-width: 400px;
            margin-bottom: 10px;
        }

        .back-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #1e1e1e;
            color: #64b5f6;
            text-align: center;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>⚠️ СЕКРЕТНА ЗОНА</h2>
        <div id="ton-connect-btn"></div>
    </div>

    <div class="main-zone">
        <div class="warning-text" id="status-text">🛑 Сказано ж вам: НЕ НАТИСКАТИ!</div>
        
        <button class="big-red-button" onclick="pressButton()">
            🚨
        </button>

        <div class="counter-badge" id="click-count">Порушень правил: 0</div>
    </div>

    <div class="footer">
        <a href="index.html" class="back-btn">← Назад до ЖЖ</a>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        // Підключаємо TON Connect і в цій кімнаті
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://gansgajder-web.github.io/Para/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-btn'
        });

        let pressCount = 0;

        // Список кумедних реакцій на натискання
        const reactions = [
            { text: "Ти що, не розумієш української? Сказано НЕ натискати! 😡", emoji: "💥", sound: 300 },
            { text: "Ну от навіщо ти знову це робиш? 🤦‍♂️", emoji: "⚠️", sound: 450 },
            { text: "Все, через тебе система перезавантажується... ⚡", emoji: "💣", sound: 150 },
            { text: "Нічого не сталося! Перестань тиснути! 🛑", emoji: "🚫", sound: 600 },
            { text: "Обережно! Гаманець може відформатуватися! 😂 (жарт)", emoji: "💸", sound: 200 },
            { text: "Ти справді думаєш, що тут є якийсь секрет? 🧐", emoji: "🔮", sound: 500 },
            { text: "Зараз викличемо бджіл! 🐝🐝🐝", emoji: "🐝", sound: 800 },
            { text: "Ну все, ти офіційно Головний Порушник ЖЖ! 🏆", emoji: "👑", sound: 900 }
        ];

        // Генератор звуків прямо в браузері без жодних аудіо-файлів!
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playBeep(freq) {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } catch(e) {}
        }

        function pressButton() {
            pressCount++;
            
            // Трусимо екран
            document.body.classList.remove('shake');
            void document.body.offsetWidth; // перезапуск анімації
            document.body.classList.add('shake');

            // Обираємо реакцію
            const reaction = reactions[(pressCount - 1) % reactions.length];
            
            document.getElementById('status-text').innerText = reaction.text;
            document.querySelector('.big-red-button').innerText = reaction.emoji;
            document.getElementById('click-count').innerText = `Порушень правил: ${pressCount}`;

            // Граємо звук
            playBeep(reaction.sound);
        }
    </script>
</body>
</html>
