name: Simple Update
on: [workflow_dispatch, push]
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - run: |
          git config user.name "gansgajder-web"
          git config user.email "gansgajder-web@users.noreply.github.com"
          date > update-log.txt
          git add update-log.txt
          git commit -m "Auto update"
          git push
