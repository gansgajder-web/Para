<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Para Content Hub</title>
    <style>
        body { background: #121212; color: #eee; font-family: sans-serif; display: flex; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 500px; }
        .box { background: #1e1e1e; padding: 20px; border-radius: 12px; margin-bottom: 15px; }
        h2 { color: #00e676; margin-top: 0; }
        .news { white-space: pre-wrap; color: #fff; line-height: 1.5; font-size: 1em; }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            <h2>Свіжий контент</h2>
            <div class="news" id="content">Завантаження...</div>
        </div>
    </div>

    <script>
        fetch('update-log.txt')
            .then(response => response.text())
            .then(data => {
                document.getElementById('content').textContent = data;
            })
            .catch(error => {
                document.getElementById('content').textContent = 'Помилка завантаження контенту';
            });
    </script>
</body>
</html>
