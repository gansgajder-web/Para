name: Auto Update Para

on:
  workflow_dispatch:

jobs:
  update-repo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Update site
        run: |
          git config user.name "gansgajder-web"
          git config user.email "gansgajder-web@users.noreply.github.com"
          echo "<p>Сайт оновлено автоматично: $(date)</p>" >> index.html
          git add index.html
          git commit -m "Авто-оновлення часу: $(date)"
          git push
