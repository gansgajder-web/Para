<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Секретна кімната — ЖЖ</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .card {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #ffb74d;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(255, 183, 77, 0.1);
        }
        h1 {
            color: #ffb74d;
            margin-top: 0;
        }
        p {
            font-size: 15px;
            line-height: 1.5;
            color: #b0bec5;
        }
        .back-btn {
            display: inline-block;
            margin-top: 20px;
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }
        .back-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🎮 Вітаємо у секретній кімнаті!</h1>
        <p>Двері успішно відчинено за донат! Тут згодом з'явиться ваша міні-гра чи інтерактивний контент.</p>
        <a href="index.html" class="back-btn">← Повернутися до Живого журналу</a>
    </div>

</body>
</html>
