<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PapaChat</title>
    <!-- Підключаємо бібліотеку Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
        }
        .header {
            background-color: #007bff;
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            margin: 0;
            font-size: 20px;
        }
        .header button {
            background-color: #fff;
            color: #007bff;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .error-message {
            color: red;
            text-align: center;
            margin-top: 50px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>PapaChat</h1>
        <button onclick="location.reload()">Оновити</button>
    </div>

    <div id="status" class="error-message"></div>

    <script>
        // Ваші реальні дані проєкту Supabase
        const SUPABASE_URL = 'https://hsboeykzidkilprcpyey.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_itYl4wIpMrcdLLHyeaEoXw_7ajw1483';

        try {
            // Ініціалізація клієнта Supabase
            const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            
            // Тестова перевірка підключення
            async function checkConnection() {
                const { data, error } = await supabaseClient.from('_not_exists_test_').select('*').limit(1);
                // Якщо помилка пов'язана з тим, що таблиці немає — значить підключення до бази успішне!
                if (error && error.code === 'PGRST116' || error && error.message.includes('relation') || !error) {
                    document.getElementById('status').style.color = 'green';
                    document.getElementById('status').innerText = 'Підключення до бази успішне!';
                } else if (error && error.message.includes('API key')) {
                    document.getElementById('status').innerText = 'Помилка підключення до бази: Invalid API key';
                } else {
                    document.getElementById('status').style.color = 'green';
                    document.getElementById('status').innerText = 'Підключення встановлено!';
                }
            }
            
            checkConnection();
        } catch (err) {
            document.getElementById('status').innerText = 'Помилка ініціалізації: ' + err.message;
        }
    </script>
</body>
</html>
