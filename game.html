<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ігрова Зала — ЖЖ</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 15px;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .header {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .header h1 {
            margin: 0;
            font-size: 18px;
            color: #ffb74d;
        }
        /* Перемикач ігор */
        .game-switcher {
            display: flex;
            gap: 6px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
        }
        .switch-btn {
            flex: 1;
            background: #1e1e1e;
            border: 1px solid #333;
            color: #aaa;
            padding: 10px 4px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
            text-align: center;
            transition: all 0.2s;
        }
        .switch-btn.active {
            background: #ffb74d;
            color: #121212;
            border-color: #ffb74d;
        }
        /* Ігрові контейнери */
        .game-card {
            display: none;
            width: 100%;
            max-width: 360px;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #333;
            text-align: center;
            box-sizing: border-box;
        }
        .game-card.active {
            display: block;
        }
        .status-text {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #64b5f6;
            min-height: 20px;
        }
        /* Ігрові сітки */
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 10px;
        }
        .cell {
            background: #252830;
            aspect-ratio: 1;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            border: 1px solid #333;
            transition: background 0.2s;
        }
        .cell:hover {
            background: #2c323f;
        }
        .cell.x { color: #ff5252; }
        .cell.o { color: #64b5f6; }
        
        /* Морський бій (два поля) */
        .battleship-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .fleet-box {
            background: #161616;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #2a2a2a;
        }
        .fleet-title {
            font-size: 11px;
            color: #888;
            margin-bottom: 5px;
        }

        /* Кнопки */
        .btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            margin-top: 5px;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        
        /* Камінь-ножиці */
        .rps-choices {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
        }
        .rps-btn {
            background: #252830;
            border: 1px solid #444;
            font-size: 26px;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
        }
        
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #ffb74d;
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🕹️ Ігрова Зала</h1>
        <div style="font-size: 11px; color: #888;">ЖЖ клуб</div>
    </div>

    <!-- Перемикач ігор -->
    <div class="game-switcher">
        <div class="switch-btn active" onclick="switchGame(0)">❌ Хрестики</div>
        <div class="switch-btn" onclick="switchGame(1)">🚢 Морський бій</div>
        <div class="switch-btn" onclick="switchGame(2)">✂️ Камінь-Ножиці</div>
    </div>

    <!-- Гра 1: Хрестики-нулики -->
    <div id="game-0" class="game-card active">
        <div class="status-text" id="ttt-status">Ваш хід (X)</div>
        <div class="board" id="ttt-board">
            <div class="cell" onclick="makeMove(0)"></div>
            <div class="cell" onclick="makeMove(1)"></div>
            <div class="cell" onclick="makeMove(2)"></div>
            <div class="cell" onclick="makeMove(3)"></div>
            <div class="cell" onclick="makeMove(4)"></div>
            <div class="cell" onclick="makeMove(5)"></div>
            <div class="cell" onclick="makeMove(6)"></div>
            <div class="cell" onclick="makeMove(7)"></div>
            <div class="cell" onclick="makeMove(8)"></div>
        </div>
        <button class="btn" onclick="resetTTT()">Нова гра</button>
    </div>

    <!-- Гра 2: Морський бій (Два поля зi звуками) -->
    <div id="game-1" class="game-card">
        <div class="status-text" id="bs-status">Ваш хід! Стріляйте по ворогу</div>
        <div class="battleship-container">
            <!-- Поле суперника для стрільби -->
            <div class="fleet-box">
                <div class="fleet-title">🎯 Ворожа акваторія</div>
                <div class="board" id="enemy-board" style="margin-bottom: 0;">
                    <div class="cell" onclick="playerShoot(0)">?</div>
                    <div class="cell" onclick="playerShoot(1)">?</div>
                    <div class="cell" onclick="playerShoot(2)">?</div>
                    <div class="cell" onclick="playerShoot(3)">?</div>
                    <div class="cell" onclick="playerShoot(4)">?</div>
                    <div class="cell" onclick="playerShoot(5)">?</div>
                    <div class="cell" onclick="playerShoot(6)">?</div>
                    <div class="cell" onclick="playerShoot(7)">?</div>
                    <div class="cell" onclick="playerShoot(8)">?</div>
                </div>
            </div>
            <!-- Поле власних кораблів -->
            <div class="fleet-box">
                <div class="fleet-title">⚓ Ваші кораблі</div>
                <div class="board" id="player-board" style="margin-bottom: 0;">
                    <div class="cell">🚢</div>
                    <div class="cell">~</div>
                    <div class="cell">~</div>
                    <div class="cell">~</div>
                    <div class="cell">🚢</div>
                    <div class="cell">~</div>
                    <div class="cell">~</div>
                    <div class="cell">~</div>
                    <div class="cell">~</div>
                </div>
            </div>
        </div>
        <button class="btn" onclick="resetBattleship()" style="margin-top: 10px;">Новий бій</button>
    </div>

    <!-- Гра 3: Камінь, ножиці, папір -->
    <div id="game-2" class="game-card">
        <div class="status-text">✂️ Камінь, ножиці, папір</div>
        <div style="font-size: 12px; color: #888; margin-bottom: 10px;">Рахунок: Ви <span id="p-score">0</span> : <span id="b-score">0</span> Бот</div>
        <div id="rps-result" style="font-size: 13px; margin-bottom: 10px; color: #fff;">Оберіть жест:</div>
        <div class="rps-choices">
            <button class="rps-btn" onclick="playRPS('rock')">✊</button>
            <button class="rps-btn" onclick="playRPS('paper')">✋</button>
            <button class="rps-btn" onclick="playRPS('scissors')">✌️</button>
        </div>
    </div>

    <a href="index.html" class="back-link">← Повернутися до Живого журналу</a>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.expand(); tg.ready(); }

        // Аудіо ефекти (синтез звуків без external файлів)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'shot') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'hit') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.setValueAtTime(200, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'miss') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(80, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            }
        }

        function switchGame(index) {
            const cards = document.querySelectorAll('.game-card');
            const btns = document.querySelectorAll('.switch-btn');
            cards.forEach((c, i) => c.classList.toggle('active', i === index));
            btns.forEach((b, i) => b.classList.toggle('active', i === index));
        }

        // Хрестики-нулики
        let tttBoard = ['', '', '', '', '', '', '', '', ''];
        let tttActive = true, tttTurn = true;

        function makeMove(i) {
            if (!tttActive || !tttTurn || tttBoard[i] !== '') return;
            tttBoard[i] = 'X';
            playSound('shot');
            updateTTT();
            if (checkWin('X')) { document.getElementById('ttt-status').innerText = 'Ви перемогли! 🎉'; tttActive = false; return; }
            if (tttBoard.every(c => c !== '')) { document.getElementById('ttt-status').innerText = 'Нічия! 🤝'; tttActive = false; return; }
            tttTurn = false;
            document.getElementById('ttt-status').innerText = 'Хід бота... 🤖';
            setTimeout(botTTT, 500);
        }

        function botTTT() {
            if (!tttActive) return;
            let empty = tttBoard.map((v, idx) => v === '' ? idx : null).filter(v => v !== null);
            if (empty.length > 0) {
                let r = empty[Math.floor(Math.random() * empty.length)];
                tttBoard[r] = 'O';
                playSound('hit');
            }
            updateTTT();
            if (checkWin('O')) { document.getElementById('ttt-status').innerText = 'Переміг Бот! 🤖'; tttActive = false; return; }
            tttTurn = true;
            document.getElementById('ttt-status').innerText = 'Ваш хід (X)';
        }

        function updateTTT() {
            const cells = document.getElementById('ttt-board').children;
            for(let i=0; i<9; i++) {
                cells[i].innerText = tttBoard[i];
                cells[i].className = 'cell ' + (tttBoard[i] === 'X' ? 'x' : 'o');
            }
        }
        function checkWin(p) {
            const w = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            return w.some(c => c.every(i => tttBoard[i] === p));
        }
        function resetTTT() {
            tttBoard = ['', '', '', '', '', '', '', '', ''];
            tttActive = true; tttTurn = true;
            document.getElementById('ttt-status').innerText = 'Ваш хід (X)';
            updateTTT();
        }

        // Морський бій (два поля)
        let enemyShips = [Math.floor(Math.random()*9), Math.floor(Math.random()*9)];
        let hitsCount = 0;

        function playerShoot(i) {
            const cells = document.getElementById('enemy-board').children;
            if (cells[i].innerText === '💥' || cells[i].innerText === '💧') return;

            playSound('shot');
            if (enemyShips.includes(i)) {
                cells[i].innerText = '💥';
                cells[i].style.background = '#e53935';
                playSound('hit');
                hitsCount++;
                if (hitsCount >= enemyShips.length) {
                    document.getElementById('bs-status').innerText = 'Перемога! Всі ворожі кораблі потоплені! 🎉';
                } else {
                    document.getElementById('bs-status').innerText = 'Влучання! Добивайте ворога!';
                }
            } else {
                cells[i].innerText = '💧';
                cells[i].style.background = '#1e88e5';
                playSound('miss');
                document.getElementById('bs-status').innerText = 'Мимо! Ворог контратакує...';
            }
        }

        function resetBattleship() {
            enemyShips = [Math.floor(Math.random()*9), Math.floor(Math.random()*9)];
            hitsCount = 0;
            const cells = document.getElementById('enemy-board').children;
            for(let c of cells) {
                c.innerText = '?';
                c.style.background = '#252830';
            }
            document.getElementById('bs-status').innerText = 'Ваш хід! Стріляйте по ворогу';
        }

        // Камінь, ножиці, папір
        let pS = 0, bS = 0;
        const emojis = { rock: '✊', paper: '✋', scissors: '✌️' };
        function playRPS(choice) {
            playSound('shot');
            const arr = ['rock', 'paper', 'scissors'];
            const bot = arr[Math.floor(Math.random()*3)];
            let res = '';
            if (choice === bot) res = `Нічия (${emojis[choice]})`;
            else if ((choice==='rock'&&bot==='scissors')||(choice==='paper'&&bot==='rock')||(choice==='scissors'&&bot==='paper')) {
                pS++; res = `Ви виграли! (${emojis[choice]} б'є ${emojis[bot]})`;
            } else {
                bS++; res = `Бот виграв! (${emojis[bot]} б'є ${emojis[choice]})`;
            }
            document.getElementById('p-score').innerText = pS;
            document.getElementById('b-score').innerText = bS;
            document.getElementById('rps-result').innerText = res;
        }
    </script>
</body>
</html>
