<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PapaChat</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- TON Connect UI SDK -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .header {
            background-color: #1f1f1f;
            color: #ffffff;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }
        .header h1 {
            margin: 0;
            font-size: 18px;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #ton-connect-btn {
            transform: scale(0.85);
            transform-origin: right center;
        }
        #chat-container {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            background: #1e1e1e;
            padding: 10px 12px;
            border-radius: 10px;
            max-width: 85%;
            border: 1px solid #2a2a2a;
            display: flex;
            gap: 10px;
        }
        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            flex-shrink: 0;
            background-size: cover;
            background-position: center;
            text-transform: uppercase;
        }
        .msg-content {
            flex: 1;
        }
        .username {
            font-size: 13px;
            font-weight: bold;
            color: #64b5f6;
            margin-bottom: 4px;
        }
        .message-text {
            word-break: break-word;
            font-size: 14px;
            margin-bottom: 6px;
        }
        .message-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            margin-top: 4px;
        }
        .action-btn {
            background: none;
            border: none;
            color: #ff5252;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .donate-msg-btn {
            color: #0088cc;
            background: rgba(0, 136, 204, 0.15);
            font-weight: bold;
        }
        .input-container {
            padding: 12px;
            background: #1f1f1f;
            display: flex;
            gap: 10px;
            border-top: 1px solid #333;
        }
        .input-container input {
            flex: 1;
            padding: 12px;
            background: #2c2c2c;
            border: 1px solid #444;
            color: #fff;
            border-radius: 8px;
            font-size: 15px;
        }
        .input-container button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>PapaChat</h1>
        <div class="header-actions">
            <!-- Кнопка авторизації TON Connect -->
            <div id="ton-connect-btn"></div>
        </div>
    </div>

    <div id="chat-container">
        <!-- Повідомлення -->
    </div>

    <div class="input-container">
        <input type="text" id="message-input" placeholder="Введіть повідомлення... 💬">
        <button onclick="sendMessage()">Надіслати</button>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        // Отримання імені з Telegram SDK
        const tgUser = tg?.initDataUnsafe?.user;
        let myTelegramName = tgUser ? (tgUser.first_name + (tgUser.last_name ? ' ' + tgUser.last_name : '')) : '';

        const SUPABASE_URL = 'https://hsboeykzidkilprcpyey.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_itYl4wIpMrcdLLHyeaEoXw_7ajw1483';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Маніфест TON Connect
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://gansgajder-web.github.io/Para/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-btn'
        });

        let connectedAddress = null;

        tonConnectUI.onStatusChange(wallet => {
            if (wallet) {
                connectedAddress = wallet.account.address;
            } else {
                connectedAddress = null;
            }
            loadMessages();
        });

        function formatAddress(addr) {
            if (!addr) return "";
            return addr.substring(0, 4) + '...' + addr.substring(addr.length - 4);
        }

        function getRandomColor(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            const colors = ['#e53935', '#d81b60', '#8e24aa', '#5e35b1', '#3949ab', '#1e88e5', '#00897b', '#43a047', '#fb8c00'];
            return colors[Math.abs(hash) % colors.length];
        }

        async function loadMessages() {
            const container = document.getElementById('chat-container');
            const { data, error } = await supabaseClient
                .from('messages')
                .select('*')
                .order('id', { ascending: true });

            if (error) return;

            container.innerHTML = '';
            if (data) {
                data.forEach(msg => {
                    const div = document.createElement('div');
                    div.className = 'message';

                    const authorName = msg.author || 'Учасник';

                    const avatar = document.createElement('div');
                    avatar.className = 'avatar';
                    avatar.style.backgroundColor = getRandomColor(authorName);
                    avatar.innerText = authorName[0].toUpperCase();

                    const content = document.createElement('div');
                    content.className = 'msg-content';

                    const author = document.createElement('div');
                    author.className = 'username';
                    author.innerText = authorName;

                    const text = document.createElement('div');
                    text.className = 'message-text';
                    text.innerText = msg.text || '';

                    const footer = document.createElement('div');
                    footer.className = 'message-footer';

                    const likesCount = msg.likes || 0;
                    const likeBtn = document.createElement('button');
                    likeBtn.className = 'action-btn';
                    likeBtn.innerHTML = `❤️ <span>${likesCount}</span>`;
                    likeBtn.onclick = () => addLike(msg.id, likesCount);

                    const targetWallet = "UQDXq1iAqu88tVRG62_k03kAXELu_1gzRBMye-VZoFRIRtWw";
                    const helpBtn = document.createElement('button');
                    helpBtn.className = 'action-btn donate-msg-btn';
                    helpBtn.innerHTML = `💸 0.01 TON`;
                    helpBtn.onclick = () => handleDonate(targetWallet, "10000000");

                    footer.appendChild(likeBtn);
                    footer.appendChild(helpBtn);

                    content.appendChild(author);
                    content.appendChild(text);
                    content.appendChild(footer);

                    div.appendChild(avatar);
                    div.appendChild(content);
                    container.appendChild(div);
                });
                container.scrollTop = container.scrollHeight;
            }
        }

        async function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;

            // Формуємо ім'я: спочатку шукаємо Telegram-ім'я, якщо немає — скорочену адресу TON
            let finalName = myTelegramName;
            
            if (!finalName && connectedAddress) {
                finalName = formatAddress(connectedAddress);
            } else if (finalName && connectedAddress) {
                finalName = `${finalName} (${formatAddress(connectedAddress)})`;
            } else if (!finalName) {
                finalName = "Михайло";
            }

            const { error } = await supabaseClient
                .from('messages')
                .insert([{
                    text: text,
                    likes: 0,
                    author: finalName
                }]);

            input.value = '';
            setTimeout(loadMessages, 300);
        }

        async function addLike(id, currentLikes) {
            const { error } = await supabaseClient
                .from('messages')
                .update({ likes: currentLikes + 1 })
                .eq('id', id);

            if (!error) loadMessages();
        }

        async function handleDonate(walletAddress, nanoAmount) {
            if (tonConnectUI.connected) {
                try {
                    const transaction = {
                        validUntil: Math.floor(Date.now() / 1000) + 60,
                        messages: [
                            {
                                address: walletAddress,
                                amount: nanoAmount
                            }
                        ]
                    };
                    await tonConnectUI.sendTransaction(transaction);
                } catch (e) {
                    console.log("Скасовано або помилка", e);
                }
            } else {
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(walletAddress);
                }
                if (tg?.showAlert) {
                    tg.showAlert(`Спочатку підключіть TON-гаманець у верхньому кутку, або скористайтеся скопійованою адресою:\n\n${walletAddress}`);
                }
            }
        }

        loadMessages();
    </script>
</body>
</html>
