<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PapaChat</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; display: flex; justify-content: center; height: 100vh; }
    .chat-container { width: 100%; max-width: 500px; background: #fff; display: flex; flex-direction: column; height: 100vh; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    .chat-header { background: #0084ff; color: #fff; padding: 15px; text-align: center; font-weight: bold; font-size: 1.2rem; }
    .messages-list { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
    .message-item { max-width: 80%; padding: 10px 14px; border-radius: 15px; background: #e4e6eb; color: #050505; align-self: flex-start; word-wrap: break-word; }
    .message-item.my-message { background: #0084ff; color: #fff; align-self: flex-end; }
    .message-author { font-size: 0.75rem; opacity: 0.7; margin-bottom: 3px; font-weight: bold; }
    .chat-input-area { padding: 10px; display: flex; gap: 8px; border-top: 1px solid #ddd; background: #fff; }
    .chat-input-area input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 20px; outline: none; font-size: 1rem; }
    .chat-input-area button { background: #0084ff; color: #fff; border: none; padding: 0 18px; border-radius: 20px; font-weight: bold; cursor: pointer; }
    .name-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center; padding: 20px; }
    .modal-content { background: #fff; padding: 25px; border-radius: 12px; width: 100%; max-width: 350px; text-align: center; }
    .modal-content input { width: 100%; padding: 10px; margin: 15px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; }
    .modal-content button { width: 100%; padding: 10px; background: #0084ff; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">PapaChat</div>
    <div class="messages-list" id="messagesList"></div>
    <div class="chat-input-area">
      <input type="text" id="messageInput" placeholder="Напишіть повідомлення..." onkeypress="handleKeyPress(event)">
      <button onclick="sendMessage()">Надіслати</button>
    </div>
  </div>

  <div class="name-modal" id="nameModal">
    <div class="modal-content">
      <h3>Представтеся</h3>
      <input type="text" id="usernameInput" placeholder="Ваше ім'я...">
      <button onclick="saveUsername()">Увійти в чат</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://hsboeykzidkilprcpyey.supabase.co";
    const SUPABASE_KEY = "Sb_publishable_itYl4wIpMrcdLLHyeaEoXw_7ajw1483";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUsername = localStorage.getItem("papachat_user") || "";

    if (currentUsername) {
      document.getElementById("nameModal").style.display = "none";
    }

    function saveUsername() {
      const name = document.getElementById("usernameInput").value.trim();
      if (name) {
        currentUsername = name;
        localStorage.setItem("papachat_user", name);
        document.getElementById("nameModal").style.display = "none";
      }
    }

    async function fetchMessages() {
      const { data, error } = await supabaseClient
        .from('messages')
        .select('*')
        .order('id', { ascending: true });

      if (!error && data) {
        const list = document.getElementById("messagesList");
        list.innerHTML = "";
        data.forEach(msg => appendMessage(msg));
        list.scrollTop = list.scrollHeight;
      }
    }

    function appendMessage(msg) {
      const list = document.getElementById("messagesList");
      const div = document.createElement("div");
      const isMe = msg.user_name === currentUsername;

      div.className = `message-item ${isMe ? 'my-message' : ''}`;
      div.innerHTML = `
        <div class="message-author">${escapeHtml(msg.user_name || 'Анонім')}</div>
        <div class="message-text">${escapeHtml(msg.text || '')}</div>
      `;
      list.appendChild(div);
      list.scrollTop = list.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById("messageInput");
      const text = input.value.trim();
      if (!text || !currentUsername) return;

      input.value = "";
      await supabaseClient.from('messages').insert([{ user_name: currentUsername, text: text }]);
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') sendMessage();
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Підписка на реальний час (Realtime)
    supabaseClient
      .channel('public:messages')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
        appendMessage(payload.new);
      })
      .subscribe();

    fetchMessages();
  </script>
</body>
</html>
