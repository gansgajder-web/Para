<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ігрова зала — Секретна кімната</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- TON Connect UI SDK -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 15px;
        }

        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid #222;
        }

        .header h2 {
            font-size: 15px;
            color: #ffc107;
        }

        #ton-connect-btn {
            transform: scale(0.85);
            transform-origin: right center;
        }

        .game-switcher {
            display: flex;
            gap: 8px;
            margin: 12px 0;
            width: 100%;
            max-width: 340px;
        }

        .switch-btn {
            flex: 1;
            background: #1e1e1e;
            color: #aaa;
            border: 1px solid #333;
            padding: 8px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .switch-btn.active {
            background: #ffc107;
            color: #121212;
            border-color: #ffc107;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            width: 100%;
        }

        .status-msg {
            font-size: 14px;
            font-weight: 500;
            color: #64b5f6;
            margin-bottom: 10px;
            text-align: center;
            min-height: 20px;
        }

        /* Хрестики-нулики */
        .tictactoe-board {
            display: grid;
            grid-template-columns: repeat(3, 85px);
            grid-template-rows: repeat(3, 85px);
            gap: 8px;
            background-color: #222;
            padding: 8px;
            border-radius: 12px;
            border: 1px solid #333;
        }

        .ttt-cell {
            background-color: #1c1c1e;
            border: none;
            border-radius: 8px;
            font-size: 38px;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ttt-cell.x { color: #ff5252; }
        .ttt-cell.o { color: #64b5f6; }

        /* Морський бій — дуель */
        .battleship-boards-wrapper {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        .board-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .board-title {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 4px;
        }

        .battleship-board {
            display: grid;
            grid-template-columns: repeat(5, 42px);
            grid-template-rows: repeat(5, 42px);
            gap: 4px;
            background-color: #222;
            padding: 5px;
            border-radius: 8px;
            border: 1px solid #333;
        }

        .bs-cell {
            background-color: #1c1c1e;
            border: 1px solid #333;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bs-cell.ship { background-color: rgba(255, 193, 7, 0.3); }
        .bs-cell.hit { background-color: rgba(255, 82, 82, 0.3); }
        .bs-cell.miss { background-color: rgba(100, 181, 246, 0.2); }

        .action-btn {
            margin-top: 15px;
            background-color: #2c2c2e;
            color: #ffc107;
            border: 1px solid #444;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        .footer {
            width: 100%;
            max-width: 400px;
            margin-top: 10px;
        }

        .back-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #1e1e1e;
            color: #ffc107;
            text-align: center;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>🕹️ Ігрова Зала</h2>
        <div id="ton-connect-btn"></div>
    </div>

    <div class="game-switcher">
        <button class="switch-btn active" id="tab-ttt" onclick="switchGame('ttt')">❌ Хрестики-нулики</button>
        <button class="switch-btn" id="tab-bs" onclick="switchGame('bs')">🚢 Морський бій (Дуель)</button>
    </div>

    <div class="game-container">
        <!-- Хрестики-нулики -->
        <div id="game-ttt" style="display: flex; flex-direction: column; align-items: center;">
            <div class="status-msg" id="ttt-status">Ваш хід (X) проти розумного Бота</div>
            <div class="tictactoe-board" id="ttt-board">
                <button class="ttt-cell" onclick="makeTTTMove(0)"></button>
                <button class="ttt-cell" onclick="makeTTTMove(1)"></button>
                <button class="ttt-cell" onclick="makeTTTMove(2)"></button>
                <button class="ttt-cell" onclick="makeTTTMove(3)"></button>
                <button class="ttt-cell" onclick="makeTTTMove(4)"></button>
                <button class="ttt-cell" onclick="makeTTTMove(5)"></button>
                <button class="ttt-cell" onclick="makeTTTMove(6)"></button>
                <button class="ttt-cell" onclick="makeTTTMove(7)"></button>
                <button class="ttt-cell" onclick="makeTTTMove(8)"></button>
            </div>
            <button class="action-btn" onclick="resetTTT()">🔄 Нова гра</button>
        </div>

        <!-- Морський бій: Розстановка та Дуель -->
        <div id="game-bs" style="display: none; flex-direction: column; align-items: center;">
            <div class="status-msg" id="bs-status">Розставте 3 свої кораблі на нижньому полі!</div>
            
            <div class="battleship-boards-wrapper">
                <div class="board-section" id="enemy-section" style="display:none;">
                    <span class="board-title">🎯 Поле супротивника (стріляйте сюди)</span>
                    <div class="battleship-board" id="bs-enemy-board"></div>
                </div>

                <div class="board-section">
                    <span class="board-title" id="my-board-title">🛡️ Ваш флот (натисніть 3 клітинки)</span>
                    <div class="battleship-board" id="bs-my-board"></div>
                </div>
            </div>

            <button class="action-btn" id="bs-action-btn" onclick="resetBS()">🔄 Переставити</button>
        </div>
    </div>

    <div class="footer">
        <a href="index.html" class="back-btn">← Повернутися до ЖЖ</a>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.expand(); tg.ready(); }

        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://gansgajder-web.github.io/Para/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-btn'
        });

        function switchGame(game) {
            document.getElementById('game-ttt').style.display = game === 'ttt' ? 'flex' : 'none';
            document.getElementById('game-bs').style.display = game === 'bs' ? 'flex' : 'none';
            document.getElementById('tab-ttt').classList.toggle('active', game === 'ttt');
            document.getElementById('tab-bs').classList.toggle('active', game === 'bs');
            if(game === 'bs' && bsMyCells.length === 0) initBS();
        }

        /* --- ХРЕСТИКИ-НУЛИКИ --- */
        let tttBoard = ["", "", "", "", "", "", "", "", ""];
        let tttActive = true;
        const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
        const tttCells = document.querySelectorAll('.ttt-cell');

        function makeTTTMove(i) {
            if (tttBoard[i] !== "" || !tttActive) return;
            tttBoard[i] = "X";
            tttCells[i].innerText = "X";
            tttCells[i].classList.add("x");

            if (checkTTTWin()) return;

            tttActive = false;
            document.getElementById('ttt-status').innerText = "Бот думає... 🤔";
            setTimeout(botTTTMove, 450);
        }

        function botTTTMove() {
            let move = findBestTTTMove();
            if (move !== null) {
                tttBoard[move] = "O";
                tttCells[move].innerText = "O";
                tttCells[move].classList.add("o");
            }
            if (!checkTTTWin()) {
                tttActive = true;
                document.getElementById('ttt-status').innerText = "Ваш хід (X)";
            }
        }

        function findBestTTTMove() {
            for (let c of wins) {
                let [a, b, cIndex] = c;
                let line = [tttBoard[a], tttBoard[b], tttBoard[cIndex]];
                if (line.filter(v => v === "O").length === 2 && line.includes("")) {
                    if (tttBoard[a] === "") return a;
                    if (tttBoard[b] === "") return b;
                    if (tttBoard[cIndex] === "") return cIndex;
                }
            }
            for (let c of wins) {
                let [a, b, cIndex] = c;
                let line = [tttBoard[a], tttBoard[b], tttBoard[cIndex]];
                if (line.filter(v => v === "X").length === 2 && line.includes("")) {
                    if (tttBoard[a] === "") return a;
                    if (tttBoard[b] === "") return b;
                    if (tttBoard[cIndex] === "") return cIndex;
                }
            }
            if (tttBoard[4] === "") return 4;
            let empty = tttBoard.map((v, idx) => v === "" ? idx : null).filter(v => v !== null);
            if (empty.length === 0) return null;
            return empty[Math.floor(Math.random() * empty.length)];
        }

        function checkTTTWin() {
            for (let c of wins) {
                if (tttBoard[c[0]] && tttBoard[c[0]] === tttBoard[c[1]] && tttBoard[c[0]] === tttBoard[c[2]]) {
                    document.getElementById('ttt-status').innerText = tttBoard[c[0]] === "X" ? "Ви перемогли! 🎉" : "Переміг Бот! 🤖";
                    tttActive = false;
                    return true;
                }
            }
            if (!tttBoard.includes("")) {
                document.getElementById('ttt-status').innerText = "Нічия! 🤝";
                tttActive = false;
                return true;
            }
            return false;
        }

        function resetTTT() {
            tttBoard = ["", "", "", "", "", "", "", "", ""];
            tttActive = true;
            document.getElementById('ttt-status').innerText = "Ваш хід (X) проти розумного Бота";
            tttCells.forEach(c => { c.innerText = ""; c.classList.remove('x', 'o'); });
        }

        /* --- МОРСЬКИЙ БІЙ: РОЗСТАНОВКА + ДУЕЛЬ --- */
        let bsEnemyBoardEl = document.getElementById('bs-enemy-board');
        let bsMyBoardEl = document.getElementById('bs-my-board');
        let bsEnemyCells = [];
        let bsMyCells = [];
        let enemyShips = [];
        let myShips = [];
        let myHits = 0;
        let botHits = 0;
        let gameState = "placing"; // "placing" або "battling"
        let bsActive = true;

        function initBS() {
            bsEnemyBoardEl.innerHTML = "";
            bsMyBoardEl.innerHTML = "";
            bsEnemyCells = [];
            bsMyCells = [];
            enemyShips = [];
            myShips = [];
            myHits = 0;
            botHits = 0;
            gameState = "placing";
            bsActive = true;

            document.getElementById('bs-status').innerText = "Розставте 3 свої кораблі (натисніть 3 клітинки знизу)";
            document.getElementById('enemy-section').style.display = "none";
            document.getElementById('my-board-title').innerText = "🛡️ Ваш флот (оберіть 3 позиції)";
            document.getElementById('bs-action-btn').innerText = "🔄 Переставити";

            // Створюємо поле гравця для розстановки
            for(let i=0; i<25; i++) {
                let cell = document.createElement('button');
                cell.className = 'bs-cell';
                cell.onclick = () => placeMyShip(i, cell);
                bsMyBoardEl.appendChild(cell);
                bsMyCells.push(cell);
            }
        }

        function placeMyShip(i, cell) {
            if (gameState !== "placing") return;
            if (myShips.includes(i)) return;

            myShips.push(i);
            cell.classList.add('ship');
            cell.innerText = "🚢";

            if (myShips.length === 3) {
                gameState = "battleship_ready";
                document.getElementById('bs-status').innerText = "Кораблі розставлені! Натисніть «Почати бій»";
                document.getElementById('bs-action-btn').innerText = "🚀 Почати бій";
                document.getElementById('bs-action-btn').onclick = startBattle;
            } else {
                document.getElementById('bs-status').innerText = `Залишилось розставити: ${3 - myShips.length} кораблі`;
            }
        }

        function startBattle() {
            gameState = "battling";
            document.getElementById('bs-action-btn').innerText = "🔄 Новий бій";
            document.getElementById('bs-action-btn').onclick = resetBS;
            document.getElementById('enemy-section').style.display = "flex";
            document.getElementById('my-board-title').innerText = "🛡️ Ваш флот";
            document.getElementById('bs-status').innerText = "Бій почався! Ваш хід — стріляйте по ворогу.";

            // Бот ховає свої кораблі
            while(enemyShips.length < 3) {
                let pos = Math.floor(Math.random() * 25);
                if(!enemyShips.includes(pos)) enemyShips.push(pos);
            }

            // Генеруємо поле ворога для стрільби
            bsEnemyBoardEl.innerHTML = "";
            bsEnemyCells = [];
            for(let i=0; i<25; i++) {
                let cell = document.createElement('button');
                cell.className = 'bs-cell';
                cell.onclick = () => playerShoot(i, cell);
                bsEnemyBoardEl.appendChild(cell);
                bsEnemyCells.push(cell);
            }

            // Очищаємо підказки з кораблями на своєму полі, залишаючи лише самі кораблі
            bsMyCells.forEach((cell, idx) => {
                cell.onclick = null; // забороняємо тицяти після старту
                if(!myShips.includes(idx)) {
                    cell.innerText = "";
                }
            });
        }

        function playerShoot(i, cell) {
            if (gameState !== "battling" || !bsActive || cell.classList.contains('hit') || cell.classList.contains('miss')) return;

            if (enemyShips.includes(i)) {
                cell.innerText = "💥";
                cell.classList.add('hit');
                myHits++;
                if (myHits === 3) {
                    document.getElementById('bs-status').innerText = "Перемога! Ви знищили весь флот бота! 🏆";
                    bsActive = false;
                    return;
                } else {
                    document.getElementById('bs-status').innerText = "Є влучання! Ворог відповідає... 🎯";
                }
            } else {
                cell.innerText = "💧";
                cell.classList.add('miss');
                document.getElementById('bs-status').innerText = "Мимо! Хід бота... 🤖";
            }

            bsActive = false;
            setTimeout(botShoot, 600);
        }

        function botShoot() {
            if (gameState === "battling" && !bsActive && myHits < 3) {
                let available = [];
                for(let i=0; i<25; i++) {
                    let c = bsMyCells[i];
                    if(!c.classList.contains('hit') && !c.classList.contains('miss')) {
                        available.push(i);
                    }
                }
                if(available.length === 0) return;

                let botTarget = available[Math.floor(Math.random() * available.length)];
                let targetCell = bsMyCells[botTarget];

                if(myShips.includes(botTarget)) {
                    targetCell.innerText = "💥";
                    targetCell.classList.add('hit');
                    botHits++;
                    if(botHits === 3) {
                        document.getElementById('bs-status').innerText = "Поразка! Бот потопив ваш флот! ❌";
                        bsActive = false;
                        return;
                    } else {
                        document.getElementById('bs-status').innerText = "Бот влучив у ваш корабель! Ваш хід 🎯";
                    }
                } else {
                    targetCell.innerText = "💧";
                    targetCell.classList.add('miss');
                    document.getElementById('bs-status').innerText = "Бот промахнувся! Ваш хід 🟢";
                }
                bsActive = true;
            }
        }

        function resetBS() {
            initBS();
        }

        initBS();
    </script>
</body>
</html>
