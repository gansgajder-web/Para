<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хрестики-Нулики — Секретна кімната</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- TON Connect UI SDK -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 15px;
        }

        /* Шапка з гаманцем */
        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid #222;
        }

        .header h2 {
            font-size: 16px;
            color: #ffc107;
        }

        #ton-connect-btn {
            transform: scale(0.85);
            transform-origin: right center;
        }

        /* Ігрова зона */
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            width: 100%;
        }

        .status-msg {
            font-size: 16px;
            font-weight: 500;
            color: #64b5f6;
            margin-bottom: 20px;
            height: 24px;
            text-align: center;
        }

        /* Ігрове поле 3х3 */
        .board {
            display: grid;
            grid-template-columns: repeat(3, 90px);
            grid-template-rows: repeat(3, 90px);
            gap: 8px;
            background-color: #222;
            padding: 8px;
            border-radius: 12px;
            border: 1px solid #333;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }

        .cell {
            background-color: #1c1c1e;
            border: none;
            border-radius: 8px;
            font-size: 42px;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s, transform 0.1s;
        }

        .cell:active {
            transform: scale(0.92);
        }

        .cell.x {
            color: #ff5252;
        }

        .cell.o {
            color: #64b5f6;
        }

        /* Кнопка перезапуску */
        .restart-btn {
            margin-top: 25px;
            background-color: #2c2c2e;
            color: #ffc107;
            border: 1px solid #444;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .restart-btn:hover {
            background-color: #3a3a3c;
        }

        /* Нижнє меню повернення */
        .footer {
            width: 100%;
            max-width: 400px;
            margin-bottom: 10px;
        }

        .back-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #1e1e1e;
            color: #ffc107;
            text-align: center;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            border: 1px solid #333;
            transition: background 0.2s;
        }

        .back-btn:hover {
            background-color: #2c2c2c;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>❌ Хрестики-Нулики</h2>
        <div id="ton-connect-btn"></div>
    </div>

    <div class="game-container">
        <div class="status-msg" id="status">Хід гравця: Х (Хрестики)</div>

        <div class="board" id="board">
            <button class="cell" onclick="makeMove(0)"></button>
            <button class="cell" onclick="makeMove(1)"></button>
            <button class="cell" onclick="makeMove(2)"></button>
            <button class="cell" onclick="makeMove(3)"></button>
            <button class="cell" onclick="makeMove(4)"></button>
            <button class="cell" onclick="makeMove(5)"></button>
            <button class="cell" onclick="makeMove(6)"></button>
            <button class="cell" onclick="makeMove(7)"></button>
            <button class="cell" onclick="makeMove(8)"></button>
        </div>

        <button class="restart-btn" onclick="resetGame()">🔄 Нова гра</button>
    </div>

    <div class="footer">
        <a href="index.html" class="back-btn">← Повернутися до Живого журналу</a>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        // Підключення TON Connect у секретній кімнаті
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://gansgajder-web.github.io/Para/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-btn'
        });

        let board = ["", "", "", "", "", "", "", "", ""];
        let currentPlayer = "X"; // X починає першим
        let isGameActive = true;

        const winningConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // Рядки
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // Стовпчики
            [0, 4, 8], [2, 4, 6]            // Діагоналі
        ];

        const statusDisplay = document.getElementById('status');
        const cells = document.querySelectorAll('.cell');

        function makeMove(index) {
            if (board[index] !== "" || !isGameActive) return;

            board[index] = currentPlayer;
            cells[index].innerText = currentPlayer;
            cells[index].classList.add(currentPlayer.toLowerCase());

            checkResult();
        }

        function checkResult() {
            let roundWon = false;

            for (let i = 0; i < winningConditions.length; i++) {
                const [a, b, c] = winningConditions[i];
                if (board[a] === "" || board[b] === "" || board[c] === "") continue;
                if (board[a] === board[b] && board[b] === board[c]) {
                    roundWon = true;
                    break;
                }
            }

            if (roundWon) {
                statusDisplay.innerText = `Перемогли ${currentPlayer === "X" ? "Хрестики (X)" : "Нулики (O)"}! 🎉`;
                isGameActive = false;
                return;
            }

            if (!board.includes("")) {
                statusDisplay.innerText = "Нічия! 🤝";
                isGameActive = false;
                return;
            }

            currentPlayer = currentPlayer === "X" ? "O" : "X";
            statusDisplay.innerText = `Хід гравця: ${currentPlayer === "X" ? "Х (Хрестики)" : "О (Нулики)"}`;
        }

        function resetGame() {
            board = ["", "", "", "", "", "", "", "", ""];
            isGameActive = true;
            currentPlayer = "X";
            statusDisplay.innerText = "Хід гравця: Х (Хрестики)";
            
            cells.forEach(cell => {
                cell.innerText = "";
                cell.classList.remove('x', 'o');
            });
        }
    </script>
</body>
</html>
