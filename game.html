<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хрестики-Нулики — Секретна кімната</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- TON Connect UI SDK -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 15px;
        }

        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid #222;
        }

        .header h2 {
            font-size: 16px;
            color: #ffc107;
        }

        #ton-connect-btn {
            transform: scale(0.85);
            transform-origin: right center;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            width: 100%;
        }

        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .mode-btn {
            background: #1e1e1e;
            color: #aaa;
            border: 1px solid #333;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
        }

        .mode-btn.active {
            background: #ffc107;
            color: #121212;
            border-color: #ffc107;
        }

        .status-msg {
            font-size: 16px;
            font-weight: 500;
            color: #64b5f6;
            margin-bottom: 15px;
            height: 24px;
            text-align: center;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 90px);
            grid-template-rows: repeat(3, 90px);
            gap: 8px;
            background-color: #222;
            padding: 8px;
            border-radius: 12px;
            border: 1px solid #333;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }

        .cell {
            background-color: #1c1c1e;
            border: none;
            border-radius: 8px;
            font-size: 42px;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s, transform 0.1s;
        }

        .cell:active {
            transform: scale(0.92);
        }

        .cell.x {
            color: #ff5252;
        }

        .cell.o {
            color: #64b5f6;
        }

        .restart-btn {
            margin-top: 20px;
            background-color: #2c2c2e;
            color: #ffc107;
            border: 1px solid #444;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        .footer {
            width: 100%;
            max-width: 400px;
            margin-bottom: 10px;
        }

        .back-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #1e1e1e;
            color: #ffc107;
            text-align: center;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>❌ Хрестики-Нулики</h2>
        <div id="ton-connect-btn"></div>
    </div>

    <div class="game-container">
        <div class="mode-selector">
            <button class="mode-btn active" id="btn-bot" onclick="setMode('bot')">🤖 Проти Бота</button>
            <button class="mode-btn" id="btn-friend" onclick="setMode('friend')">👥 З другом</button>
        </div>

        <div class="status-msg" id="status">Ваш хід (X)</div>

        <div class="board" id="board">
            <button class="cell" onclick="makeMove(0)"></button>
            <button class="cell" onclick="makeMove(1)"></button>
            <button class="cell" onclick="makeMove(2)"></button>
            <button class="cell" onclick="makeMove(3)"></button>
            <button class="cell" onclick="makeMove(4)"></button>
            <button class="cell" onclick="makeMove(5)"></button>
            <button class="cell" onclick="makeMove(6)"></button>
            <button class="cell" onclick="makeMove(7)"></button>
            <button class="cell" onclick="makeMove(8)"></button>
        </div>

        <button class="restart-btn" onclick="resetGame()">🔄 Нова гра</button>
    </div>

    <div class="footer">
        <a href="index.html" class="back-btn">← Повернутися до Живого журналу</a>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://gansgajder-web.github.io/Para/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-btn'
        });

        let board = ["", "", "", "", "", "", "", "", ""];
        let currentPlayer = "X";
        let isGameActive = true;
        let gameMode = "bot"; // "bot" або "friend"

        const winningConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];

        const statusDisplay = document.getElementById('status');
        const cells = document.querySelectorAll('.cell');

        function setMode(mode) {
            gameMode = mode;
            document.getElementById('btn-bot').classList.toggle('active', mode === 'bot');
            document.getElementById('btn-friend').classList.toggle('active', mode === 'friend');
            resetGame();
        }

        function makeMove(index) {
            if (board[index] !== "" || !isGameActive) return;

            board[index] = currentPlayer;
            cells[index].innerText = currentPlayer;
            cells[index].classList.add(currentPlayer.toLowerCase());

            if (checkResult()) return;

            if (gameMode === "bot" && currentPlayer === "X") {
                currentPlayer = "O";
                statusDisplay.innerText = "Бот думає... 🤔";
                isGameActive = false;
                setTimeout(botMove, 500);
            } else {
                currentPlayer = currentPlayer === "X" ? "O" : "X";
                statusDisplay.innerText = `Хід: ${currentPlayer}`;
            }
        }

        function botMove() {
            // Проста та розумна логіка робота
            let emptyIndices = board.map((val, idx) => val === "" ? idx : null).filter(val => val !== null);
            
            if (emptyIndices.length === 0) return;

            // 1. Перевірити, чи може Бот виграти цим ходом
            let move = findWinningMove("O");
            // 2. Якщо ні, перевірити, чи треба заблокувати виграш гравця
            if (move === null) move = findWinningMove("X");
            // 3. Інакше зробити вибір центру або випадковий хід
            if (move === null && board[4] === "") move = 4;
            if (move === null) move = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];

            board[move] = "O";
            cells[move].innerText = "O";
            cells[move].classList.add("o");

            isGameActive = true;
            if (!checkResult()) {
                currentPlayer = "X";
                statusDisplay.innerText = "Ваш хід (X)";
            }
        }

        function findWinningMove(player) {
            for (let condition of winningConditions) {
                const [a, b, c] = condition;
                const values = [board[a], board[b], board[c]];
                if (values.filter(v => v === player).length === 2 && values.includes("")) {
                    if (board[a] === "") return a;
                    if (board[b] === "") return b;
                    if (board[c] === "") return c;
                }
            }
            return null;
        }

        function checkResult() {
            let roundWon = false;

            for (let i = 0; i < winningConditions.length; i++) {
                const [a, b, c] = winningConditions[i];
                if (board[a] === "" || board[b] === "" || board[c] === "") continue;
                if (board[a] === board[b] && board[b] === board[c]) {
                    roundWon = true;
                    break;
                }
            }

            if (roundWon) {
                if (gameMode === "bot") {
                    statusDisplay.innerText = currentPlayer === "X" ? "Ви перемогли Бота! 🎉" : "Переміг Бот! 🤖";
                } else {
                    statusDisplay.innerText = `Перемогли ${currentPlayer === "X" ? "Хрестики (X)" : "Нулики (O)"}! 🎉`;
                }
                isGameActive = false;
                return true;
            }

            if (!board.includes("")) {
                statusDisplay.innerText = "Нічия! 🤝";
                isGameActive = false;
                return true;
            }

            return false;
        }

        function resetGame() {
            board = ["", "", "", "", "", "", "", "", ""];
            isGameActive = true;
            currentPlayer = "X";
            statusDisplay.innerText = gameMode === "bot" ? "Ваш хід (X)" : "Хід: X";
            
            cells.forEach(cell => {
                cell.innerText = "";
                cell.classList.remove('x', 'o');
            });
        }
    </script>
</body>
</html>
